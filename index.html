    // 0. VALLI 3D LOGO REACT COMPONENT
    function Valli3DLogo() {
      const [rotate, setRotate] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -16;
        const rotateY = ((x - centerX) / centerX) * 16;

        setRotate({ x: rotateX, y: rotateY });
      };

      const handleMouseEnter = () => setIsHovered(true);
      const handleMouseLeave = () => {
        setIsHovered(false);
        setRotate({ x: 0, y: 0 });
      };

      return (
        <div
          className="valli-3d-logo-wrapper"
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            position: 'relative',

              transition: isHovered ? 'transform 0.1s ease-out' : 'transform 0.5s ease-out',

    // 12. TOAST NOTIFICATION
    function ToastNotification({ toast, onClose }) {
      useEffect(() => {
        if (toast) {
          const t = setTimeout(onClose, 3500);
          return () => clearTimeout(t);
        }

      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [isPaid, setIsPaid] = useState(false);
      const [discountValue, setDiscountValue] = useState(0);
      const [discountType, setDiscountType] = useState('rupees');
      const [generatedBill, setGeneratedBill] = useState(null);
      const [billHistory, setBillHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('valli_bill_history');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('valli_bill_history', JSON.stringify(billHistory));
        } catch (e) { }
      }, [billHistory]);

      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (activeSection === 'home' && window.innerWidth > 768) {
          document.body.style.overflow = 'hidden';
          document.documentElement.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = 'auto';
          document.documentElement.style.overflow = 'auto';
        }
      }, [activeSection]);

      const showToast = (message, type = 'success') => setToast({ message, type });

      const subtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      let discountAmount = discountType === 'percent' ? (subtotal * (discountValue || 0)) / 100 : (discountValue || 0);
      discountAmount = Math.min(subtotal, Math.max(0, discountAmount));
      const grandTotal = Math.max(0, subtotal - discountAmount);
      const totalCartCount = cart.reduce((acc, item) => acc + item.quantity, 0);

      const handleAddToCart = (item) => {
        setCart((prev) => {
          const found = prev.find(c => c.id === item.id);
          if (found) return prev.map(c => c.id === item.id ? { ...c, quantity: c.quantity + 1 } : c);
          return [...prev, { ...item, quantity: 1 }];
        });
        showToast(`Added "${item.name}" to Bill!`);
      };

      const handleUpdateQuantity = (id, newQty) => {
        if (newQty <= 0) handleRemoveItem(id);
        else setCart((prev) => prev.map(c => c.id === id ? { ...c, quantity: newQty } : c));
      };

      const handleRemoveItem = (id) => {
        const item = cart.find(c => c.id === id);
        setCart((prev) => prev.filter(c => c.id !== id));
        if (item) showToast(`Removed "${item.name}" from Bill`, 'info');
      };

      const handleClearBill = () => {
        if (cart.length === 0) return;
        setCart([]);
        setDiscountValue(0);
        setIsPaid(false);
        showToast('Cleared current bill items.', 'info');
      };

      const handleClearHistory = () => {
        setBillHistory([]);
        try {
          localStorage.setItem('valli_bill_history', '[]');
        } catch (e) { }
        showToast('Cleared all bill history.', 'success');
      };

      const handleGenerateBill = () => {
        if (cart.length === 0) {
          showToast('Please add at least one food item to generate a bill.', 'error');
          return;
        }
        const now = new Date();
        const billNo = 'VFS-' + now.getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
        const dateStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

        const newBillSnapshot = {
          billNo,
          date: dateStr,
          time: timeStr,
          customer: { name: 'Walk-in Customer', phone: '-', orderType: 'POS Order', tableNo: '-' },
          items: [...cart],
          subtotal,
          discountValue,
          discountType,
          discount: discountAmount,
          grandTotal,
          paymentMethod,
          isPaid: true
        };

        setGeneratedBill(newBillSnapshot);
        setBillHistory(prev => [newBillSnapshot, ...prev]);
        showToast('Generated Bill #' + billNo + '!');
      };

      const handleDoneBill = () => {
        setCart([]);
        setDiscountValue(0);
        setDiscountType('rupees');
        setPaymentMethod('Cash');
        setIsPaid(false);
        setGeneratedBill(null);
        scrollToSection('history');
      };

      const handleNewBill = () => {
        setCart([]);
        setDiscountValue(0);
        setIsPaid(false);
        setGeneratedBill(null);
        showToast('Started a fresh new bill.', 'success');
      };

      const scrollToSection = (id) => {
        setActiveSection(id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="app-root-container" style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Navbar
            cartCount={totalCartCount}
            onOpenCart={() => scrollToSection('billing')}
            activeSection={activeSection}
            setActiveSection={scrollToSection}
          />
          <main className="app-main-content" style={{ flexGrow: 1, display: 'flex', flexDirection: 'column' }}>
            {activeSection === 'home' && (
              <Hero
                onStartBilling={() => scrollToSection('menu')}
                onHistory={() => scrollToSection('history')}
                onTotal={() => scrollToSection('total')}
              />
            )}
            {activeSection === 'menu' && (
              <MenuSection
                cart={cart}
                onAddToCart={handleAddToCart}
                onUpdateQuantity={handleUpdateQuantity}
                onNavigateToBilling={() => scrollToSection('billing')}
                onBackToHome={() => scrollToSection('home')}
              />
            )}
            {activeSection === 'billing' && (
              <BillingDashboard
                cart={cart}
                paymentMethod={paymentMethod}
                setPaymentMethod={setPaymentMethod}
                isPaid={isPaid}
                setIsPaid={setIsPaid}
                discountValue={discountValue}
                setDiscountValue={setDiscountValue}
                discountType={discountType}
                setDiscountType={setDiscountType}
                onUpdateQuantity={handleUpdateQuantity}
                onRemoveItem={handleRemoveItem}
                onClearBill={handleClearBill}
                onGenerateBill={handleGenerateBill}
                subtotal={subtotal}
                discountAmount={discountAmount}
                grandTotal={grandTotal}
                onBackToHome={() => scrollToSection('home')}
              />
            )}
            {activeSection === 'history' && <HistorySection billHistory={billHistory} onBackToHome={() => scrollToSection('home')} />}
            {activeSection === 'total' && <TotalSection billHistory={billHistory} onBackToHome={() => scrollToSection('home')} />}
            {activeSection === 'about' && <AboutSection />}
            {activeSection === 'contact' && <ContactSection showToast={showToast} />}
          </main>
          <ReceiptModal
            bill={generatedBill}
            onClose={() => setGeneratedBill(null)}
            onDone={handleDoneBill}
          />
        </div>
      );
    }

    // Render React Application into DOM
    if (typeof ReactDOM !== 'undefined' && document.getElementById('root')) {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }
  </script>
  <script type="module" src="./src/main.jsx"></script>
</body>

</html>
